[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yshorts-bot"
version = "1.2.0"
description = "AI-assisted YouTube Shorts automation queue (Google Flow + FFmpeg + YouTube Data API)"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
  "python-dotenv>=1.0.1",
  "pydantic>=2.7.0",
  "requests>=2.32.0",
  "google-api-python-client>=2.137.0",
  "google-auth-oauthlib>=1.2.1",
  "google-auth-httplib2>=0.2.0",
  "fastapi>=0.111.0",
  "uvicorn>=0.30.0",
  "python-multipart>=0.0.9",
  "imageio-ffmpeg>=0.5.1",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
browser = ["playwright>=1.44.0"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
yshorts-bot = "yshorts_bot.cli:main"

[tool.setuptools.packages.find]
include = ["yshorts_bot*"]

[tool.setuptools.package-data]
yshorts_bot = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
